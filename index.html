<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Портфель активов</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-alt: #f5f5f7;
      --ink: #1d1d1f;
      --ink-sec: #6e6e73;
      --ink-muted: #86868b;
      --divider: #d2d2d7;
      --divider-light: #e8e8ed;
      --blue: #0071e3;
      --blue-hover: #0077ed;
      --orange-eyebrow: #bf4800;
      --pos: #15803d;
      --neg: #d93025;
      --c-stocks: #0071e3;
      --c-bonds: #34a853;
      --c-gold: #e67e22;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 24px 80px;
    }

    /* Top Minimal Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--divider-light);
      margin-bottom: 44px;
      gap: 16px;
      flex-wrap: wrap;
    }

    .nav-title {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--ink);
    }

    .nav-status {
      font-size: 12px;
      color: var(--ink-muted);
      margin-top: 2px;
    }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .pill-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 980px;
      border: none;
      background: #1d1d1f;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .pill-btn:hover {
      background: #333336;
    }

    .link-btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 8px 14px;
      border-radius: 980px;
      border: 1px solid var(--divider);
      background: #ffffff;
      color: #1d1d1f;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .link-btn:hover {
      background: var(--bg-alt);
      border-color: #1d1d1f;
    }

    /* Hero Portfolio Value (Apple Centered Typography) */
    .hero-block {
      text-align: center;
      margin-bottom: 48px;
    }

    .hero-eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--orange-eyebrow);
      letter-spacing: 0.01em;
      margin-bottom: 6px;
    }

    .hero-value {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.03em;
      color: var(--ink);
      line-height: 1.08;
      font-variant-numeric: tabular-nums;
    }

    @media (max-width: 600px) {
      .hero-value {
        font-size: 36px;
      }
    }

    .hero-sub {
      font-size: 15px;
      color: var(--ink-sec);
      margin-top: 10px;
      font-variant-numeric: tabular-nums;
    }

    /* Apple Compare 3-Column Asset Class Section */
    .compare-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 32px;
      padding-bottom: 44px;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 44px;
    }

    @media (max-width: 820px) {
      .compare-grid {
        grid-template-columns: 1fr;
        gap: 36px;
      }
    }

    .compare-col {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .col-dots {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
    }

    .col-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #d2d2d7;
    }

    .col-dot.active {
      background: var(--ink);
    }

    .col-eyebrow {
      font-size: 12px;
      font-weight: 600;
      color: var(--orange-eyebrow);
      margin-bottom: 4px;
    }

    .col-name {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: var(--ink);
      line-height: 1.15;
    }

    .col-tagline {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 4px;
    }

    .col-desc {
      font-size: 13px;
      color: var(--ink-sec);
      margin-top: 10px;
      line-height: 1.4;
      font-variant-numeric: tabular-nums;
    }

    .col-cta {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .col-link {
      font-size: 13px;
      font-weight: 500;
      color: var(--blue);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0;
    }

    .col-link:hover {
      text-decoration: underline;
    }

    /* Spec Rows inside Apple Compare Columns (aligned horizontal rhythm) */
    .spec-divider {
      width: 100%;
      height: 1px;
      background: var(--divider-light);
      margin: 26px 0 22px;
    }

    .spec-big {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1.15;
    }

    .spec-caption {
      font-size: 12px;
      color: var(--ink-sec);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .spec-icon {
      margin-top: 22px;
      margin-bottom: 6px;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 32px;
    }

    .spec-chip-box {
      display: inline-flex;
      gap: 6px;
      margin-top: 22px;
      margin-bottom: 6px;
    }

    .spec-chip {
      border: 1.5px solid var(--ink);
      border-radius: 7px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--ink);
    }

    /* Pie Chart Section (Clean Light Reference Style) */
    .pie-section {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 56px;
      padding-bottom: 44px;
      border-bottom: 1px solid var(--divider);
      margin-bottom: 40px;
      flex-wrap: wrap;
    }

    .pie-box {
      width: 252px;
      height: 252px;
      position: relative;
    }

    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .pie-leg-row {
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .pie-swatch {
      width: 16px;
      height: 16px;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .pie-leg-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--ink);
    }

    .pie-leg-sub {
      font-size: 12.5px;
      color: var(--ink-sec);
      font-variant-numeric: tabular-nums;
    }

    /* Positions Section (Apple Spec-Table Style — Clean Open Rows, No Heavy Box) */
    .positions-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 20px;
    }

    .positions-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .filter-pills {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .fpill {
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 15px;
      border-radius: 980px;
      border: 1px solid var(--divider);
      background: #ffffff;
      color: var(--ink-sec);
      cursor: pointer;
      transition: all 0.15s;
    }

    .fpill:hover {
      border-color: var(--ink);
      color: var(--ink);
    }

    .fpill.active {
      background: var(--ink);
      border-color: var(--ink);
      color: #ffffff;
    }

    .search-pill {
      font-family: inherit;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 980px;
      border: 1px solid var(--divider);
      background: var(--bg-alt);
      color: var(--ink);
      min-width: 210px;
      outline: none;
    }

    .search-pill:focus {
      background: #ffffff;
      border-color: var(--blue);
    }

    .table-wrap {
      width: 100%;
      overflow-x: auto;
    }

    table.apple-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.apple-table thead th {
      font-size: 11px;
      font-weight: 600;
      color: var(--ink-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 12px 8px;
      border-bottom: 1px solid var(--divider);
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
    }

    table.apple-table thead th:hover {
      color: var(--ink);
    }

    table.apple-table tbody td {
      padding: 14px 8px;
      border-bottom: 1px solid var(--divider-light);
      vertical-align: middle;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    table.apple-table tbody td:first-child {
      white-space: normal;
      min-width: 180px;
    }

    table.apple-table tbody tr:hover {
      background: #fafafa;
    }

    table.apple-table tfoot td {
      padding: 16px 8px;
      border-top: 1px solid var(--divider);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .num {
      text-align: right !important;
    }

    .pos { color: var(--pos); }
    .neg { color: var(--neg); }

    .asset-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      display: block;
    }

    .asset-sub {
      font-size: 11.5px;
      color: var(--ink-muted);
      display: block;
      margin-top: 1px;
    }

    .class-dot-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      color: var(--ink-sec);
      font-weight: 500;
    }

    .c-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .row-btns {
      display: inline-flex;
      gap: 6px;
    }

    .mini-link {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      color: var(--blue);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }

    .mini-link:hover {
      text-decoration: underline;
    }

    .mini-del {
      font-family: inherit;
      font-size: 12px;
      color: var(--ink-muted);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 4px;
    }

    .mini-del:hover {
      color: var(--neg);
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 16px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-box {
      background: #ffffff;
      border-radius: 18px;
      width: 100%;
      max-width: 440px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.14);
    }

    .modal-box h2 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink-sec);
      margin-bottom: 5px;
    }

    .field input, .field select {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid var(--divider);
      border-radius: 10px;
      font-family: inherit;
      background: #ffffff;
      color: var(--ink);
    }

    .field input:focus, .field select:focus {
      outline: none;
      border-color: var(--blue);
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 22px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Minimal Apple-style Top Bar -->
    <div class="top-nav">
      <div>
        <div class="nav-title">Портфель</div>
        <div class="nav-status" id="syncStatus">Локальные данные</div>
      </div>
      <div class="nav-actions">
        <button class="link-btn" onclick="openModal()">+ Добавить позицию</button>
        <button class="pill-btn" id="btnRefresh" onclick="refreshMarketData()">Обновить котировки</button>
      </div>
    </div>

    <!-- Centered Hero Summary -->
    <div class="hero-block">
      <div class="hero-eyebrow">Текущая оценка активов</div>
      <div class="hero-value" id="heroTotalVal">0 ₽</div>
      <div class="hero-sub" id="heroSubLine">Вложено 0 ₽ · Результат 0 ₽ (0,00%)</div>
    </div>

    <!-- Apple Compare-Style 3-Column Asset Class Comparison -->
    <div class="compare-grid" id="compareGrid"></div>

    <!-- Clean Solid Pie Chart + Legend -->
    <div class="pie-section">
      <div class="pie-box">
        <canvas id="pieChart"></canvas>
      </div>
      <div class="pie-legend" id="pieLegend"></div>
    </div>

    <!-- Positions Table Section -->
    <div class="positions-header">
      <div class="positions-title">Состав портфеля</div>
      <div class="filter-pills">
        <button class="fpill active" data-cat="all" onclick="setFilter('all', this)">Все</button>
        <button class="fpill" data-cat="Облигации" onclick="setFilter('Облигации', this)">Облигации</button>
        <button class="fpill" data-cat="Акции" onclick="setFilter('Акции', this)">Акции</button>
        <button class="fpill" data-cat="Золото" onclick="setFilter('Золото', this)">Золото</button>
        <input type="text" class="search-pill" id="searchInput" placeholder="Поиск..." oninput="renderAll()" />
      </div>
    </div>

    <div class="table-wrap">
      <table class="apple-table">
        <thead>
          <tr>
            <th onclick="sortBy('name')">Актив</th>
            <th onclick="sortBy('category')">Класс</th>
            <th class="num" onclick="sortBy('qty')">Кол-во</th>
            <th class="num" onclick="sortBy('avgPrice')">Покупка</th>
            <th class="num" onclick="sortBy('currPrice')">Цена</th>
            <th class="num" onclick="sortBy('invested')">Вложено</th>
            <th class="num" onclick="sortBy('value')">Оценка</th>
            <th class="num" onclick="sortBy('plRub')">P/L, ₽</th>
            <th class="num" onclick="sortBy('plPct')">P/L, %</th>
            <th class="num" onclick="sortBy('share')">Доля</th>
            <th class="num"></th>
          </tr>
        </thead>
        <tbody id="holdingsBody"></tbody>
        <tfoot id="holdingsFoot"></tfoot>
      </table>
    </div>
  </div>

  <!-- Add / Edit Modal -->
  <div class="modal-bg" id="editModal">
    <div class="modal-box">
      <h2 id="modalTitle">Новая позиция</h2>
      <input type="hidden" id="editIndex" value="-1" />
      <div class="field-grid">
        <div class="field">
          <label>Класс актива</label>
          <select id="fCategory" onchange="syncBoardSelect()">
            <option value="Облигации">Облигации</option>
            <option value="Акции">Акции</option>
            <option value="Золото">Золото</option>
          </select>
        </div>
        <div class="field">
          <label>Секция (Board)</label>
          <select id="fBoard">
            <option value="TQCB">TQCB (Корп. облигации)</option>
            <option value="TQOB">TQOB (ОФЗ)</option>
            <option value="TQBR">TQBR (Акции)</option>
            <option value="GOLD">GOLD (Монеты / Золото)</option>
          </select>
        </div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label>Тикер / ISIN (для монет не нужен)</label>
          <input type="text" id="fTicker" placeholder="Необязательно" />
        </div>
        <div class="field">
          <label>Наименование *</label>
          <input type="text" id="fName" placeholder="Например: 5 рублей Николай II" />
        </div>
      </div>
      <div class="field-grid">
        <div class="field">
          <label>Количество (шт.) *</label>
          <input type="number" id="fQty" step="1" />
        </div>
        <div class="field">
          <label>Цена покупки (₽ за 1 шт.) *</label>
          <input type="number" id="fAvgPrice" step="0.01" />
        </div>
      </div>
      <div class="field">
        <label>Текущая цена / цена продажи (₽ за 1 шт.)</label>
        <input type="number" id="fCurrPrice" step="0.01" placeholder="Если пусто — равна цене покупки" />
      </div>
      <div class="modal-footer">
        <button class="link-btn" onclick="closeModal()">Отмена</button>
        <button class="pill-btn" onclick="savePosition()">Сохранить</button>
      </div>
    </div>
  </div>

    function savePosition() {
      const idx = parseInt(document.getElementById("editIndex").value, 10);
      const category = document.getElementById("fCategory").value;
      const board = document.getElementById("fBoard").value;
      const rawTicker = document.getElementById("fTicker").value.trim().toUpperCase();
      const rawName = document.getElementById("fName").value.trim();
      const qty = parseFloat(document.getElementById("fQty").value);
      const avgPrice = parseFloat(document.getElementById("fAvgPrice").value);
      const parsedCurr = parseFloat(document.getElementById("fCurrPrice").value);
      const currPrice = (!isNaN(parsedCurr) && parsedCurr > 0) ? parsedCurr : avgPrice;

      if (category !== "Золото" && !rawTicker && !rawName) {
        alert("Укажите тикер или наименование бумаги, количество и цену покупки.");
        return;
      }
      if (category === "Золото" && !rawName && !rawTicker) {
        alert("Укажите наименование монеты, количество и цену покупки.");
        return;
      }
      if (isNaN(qty) || qty <= 0 || isNaN(avgPrice) || avgPrice <= 0) {
        alert("Заполните корректное количество и цену покупки.");
        return;
      }

      const ticker = rawTicker;
      const name = rawName || rawTicker;

      const record = {
        ticker,
        name,
        category,
        board,
        qty,
        avgPrice,
        currPrice,
        faceValue: category === "Облигации" ? 1000 : undefined
      };

      if (idx >= 0) {
        if (holdings[idx].pureGrams && Math.abs(currPrice - holdings[idx].currPrice) < 1) {
          record.pureGrams = holdings[idx].pureGrams;
          record.premium = holdings[idx].premium;
        }
        holdings[idx] = record;
      } else {
        holdings.push(record);
      }

      persist();
      renderAll();
      closeModal();
    }

    async function fetchMoexBoardWithFallback(market, board) {
      const targetUrl = `https://iss.moex.com/iss/engines/stock/markets/${market}/boards/${board}/securities.json?iss.meta=off&iss.only=securities,marketdata`;
      try {
        const res = await fetch(targetUrl);
        if (res.ok) return await res.json();
      } catch (e) {}

      const proxies = [
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];
      for (const proxyUrl of proxies) {
        try {
          const res = await fetch(proxyUrl);
          if (res.ok) return await res.json();
        } catch (e) {}
      }
      return null;
    }

    async function fetchSingleMoexTicker(market, board, ticker) {
      const targetUrl = `https://iss.moex.com/iss/engines/stock/markets/${market}/boards/${board}/securities/${encodeURIComponent(ticker)}.json?iss.meta=off&iss.only=securities,marketdata`;
      try {
        const res = await fetch(targetUrl);
        if (res.ok) return await res.json();
      } catch (e) {}
      try {
        const res = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`);
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    function extractPriceFromMoexJson(json, board) {
      const map = {};
      if (!json || !json.securities || !json.marketdata) return map;

      const sCols = json.securities.columns || [];
      const mCols = json.marketdata.columns || [];
      const sId = sCols.indexOf("SECID");
      const sPrev = sCols.indexOf("PREVPRICE");
      const sFace = sCols.indexOf("FACEVALUE");

      const mId = mCols.indexOf("SECID");
      const mLast = mCols.indexOf("LAST");
      const mCurr = mCols.indexOf("LCURRENTPRICE");
      const mMkt = mCols.indexOf("MARKETPRICE");
      const mClose = mCols.indexOf("CLOSEPRICE");

      const mdMap = {};
      (json.marketdata.data || []).forEach(r => {
        const id = r[mId];
        const liveP = r[mLast] || r[mCurr] || r[mMkt] || r[mClose];
        if (id && liveP !== null && liveP !== undefined && Number(liveP) > 0) {
          mdMap[id] = Number(liveP);
        }
      });

      (json.securities.data || []).forEach(r => {
        const id = r[sId];
        const rawP = mdMap[id] ?? (r[sPrev] !== null ? Number(r[sPrev]) : null);
        if (id && rawP && rawP > 0) {
          if (board === "TQBR") {
            map[id] = rawP;
          } else {
            const fv = Number(r[sFace]) || 1000;
            map[id] = (rawP / 100) * fv;
          }
        }
      });
      return map;
    }

    async function refreshMarketData() {
      const btn = document.getElementById("btnRefresh");
      const status = document.getElementById("syncStatus");
      btn.disabled = true;
      btn.textContent = "Загрузка...";
      status.textContent = "Запрос котировок MOEX...";

      try {
        const cbrRes = await fetch("https://www.cbr-xml-daily.ru/daily_json.js");
        if (cbrRes.ok) {
          const cbr = await cbrRes.json();
          if (cbr?.Valute?.USD?.Value) {
            rates.usdRub = cbr.Valute.USD.Value;
          }
        }

        const boards = ["TQBR", "TQOB", "TQCB"];
        const prices = {};

        for (const board of boards) {
          const market = board === "TQBR" ? "shares" : "bonds";
          const json = await fetchMoexBoardWithFallback(market, board);
          const boardPrices = extractPriceFromMoexJson(json, board);
          Object.assign(prices, boardPrices);
        }

        const missingItems = holdings.filter(h => h.category !== "Золото" && h.ticker && !prices[h.ticker]);
        for (const item of missingItems) {
          const market = item.board === "TQBR" ? "shares" : "bonds";
          const singleJson = await fetchSingleMoexTicker(market, item.board, item.ticker);
          const singleMap = extractPriceFromMoexJson(singleJson, item.board);
          if (singleMap[item.ticker]) {
            prices[item.ticker] = singleMap[item.ticker];
          }
        }

        let gotLiveGold = false;
        try {
          const gldUrl = "https://iss.moex.com/iss/engines/currency/markets/selt/boards/CETS/securities/GLDRUB_TOM.json?iss.meta=off&iss.only=securities,marketdata";
          let gldRes = await fetch(gldUrl).catch(() => null);
          if (!gldRes || !gldRes.ok) {
            gldRes = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(gldUrl)}`).catch(() => null);
          }
          if (gldRes && gldRes.ok) {
            const gldJson = await gldRes.json();
            const gSecCols = gldJson.securities.columns || [];
            const gMdCols = gldJson.marketdata.columns || [];
            const mdRow = gldJson.marketdata.data?.[0] || [];
            const secRow = gldJson.securities.data?.[0] || [];
            const gLast = mdRow[gMdCols.indexOf("LAST")] || mdRow[gMdCols.indexOf("LCURRENTPRICE")] || mdRow[gMdCols.indexOf("MARKETPRICE")];
            const gPrev = secRow[gSecCols.indexOf("PREVPRICE")];
            const gramPriceMoex = gLast || gPrev;
            if (gramPriceMoex && gramPriceMoex > 1000) {
              rates.goldGramRubDirect = gramPriceMoex;
              rates.xauUsd = (gramPriceMoex * 31.1034768) / rates.usdRub;
              gotLiveGold = true;
            }
          }
        } catch (err) {}

        if (!gotLiveGold) {
          try {
            const spotRes = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=pax-gold&vs_currencies=usd");
            if (spotRes.ok) {
              const spotJson = await spotRes.json();
              const ozUsd = spotJson?.["pax-gold"]?.usd;
              if (ozUsd && ozUsd > 1000) {
                rates.xauUsd = ozUsd;
                rates.goldGramRubDirect = (ozUsd / 31.1034768) * rates.usdRub;
                gotLiveGold = true;
              }
            }
          } catch (err2) {}
        }

        let updated = 0;
        holdings.forEach(item => {
          if (item.ticker && prices[item.ticker]) {
            item.currPrice = Number(prices[item.ticker].toFixed(2));
            updated++;
          }
        });

        persist();
        renderAll();
        const t = new Date().toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        status.textContent = updated > 0
          ? `Обновлено в ${t} (MOEX: ${updated} из ${holdings.filter(h => h.category !== "Золото" && h.ticker).length})`
          : `MOEX недоступен из браузера в ${t} (показаны сохранённые цены)`;
      } catch (e) {
        status.textContent = "Ошибка сети MOEX (используются сохранённые цены)";
      } finally {
        btn.disabled = false;
        btn.textContent = "Обновить котировки";
      }
    }

    (async function bootstrap() {
      if (!Array.isArray(holdings) || holdings.length === 0) {
        holdings = structuredClone(DEFAULT_HOLDINGS);
        persist();
      }
      renderAll();
      refreshMarketData();
    })();
  </script>
</body>
</html>
